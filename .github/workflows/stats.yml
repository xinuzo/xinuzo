name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create profile directory
        run: mkdir -p profile

      - name: Fetch GitHub Stats
        run: curl -f -L -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=radical" -o profile/stats.svg

      - name: Fetch Top Languages
        run: curl -f -L -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=radical" -o profile/top-langs.svg

      - name: Commit and Push SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "chore: update GitHub stats SVGs" || exit 0
          git push
